name: release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/envy-ci

jobs:
  # Freeze the CI image under this release's tag before anything builds. `latest` is a
  # moving target -- the weekly rebuild picks up whatever Ubuntu shipped that week -- so
  # without this pin, rebuilding v1.2.3 a year from now would use a different toolchain
  # than the binaries the release actually shipped. imagetools copies the manifest list,
  # so both arches come along and nothing is rebuilt.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin CI image to ${{ github.ref_name }}
        run: |
          docker buildx imagetools create --tag "$IMAGE:${{ github.ref_name }}" "$IMAGE:latest"
          docker buildx imagetools inspect "$IMAGE:${{ github.ref_name }}"

  ci:
    needs: image
    uses: ./.github/workflows/ci.yml
    with:
      image_tag: ${{ github.ref_name }}

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download CI artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package release artifacts
        run: |
          mkdir -p release
          tar -czf release/envy-linux-x86_64.tar.gz -C artifacts/envy-linux-x64-main envy
          tar -czf release/envy-linux-arm64.tar.gz -C artifacts/envy-linux-arm64-main envy
          tar -czf release/envy-darwin-arm64.tar.gz -C artifacts/envy-macos-arm64-main envy
          tar -czf release/envy-darwin-x86_64.tar.gz -C artifacts/envy-macos-x64-main envy
          cd artifacts/envy-windows-x64-main && zip ../../release/envy-windows-x86_64.zip envy.exe && cd ../..
          cd artifacts/envy-windows-arm64-main && zip ../../release/envy-windows-arm64.zip envy.exe

      # A project's `@envy sha256sums` pins this file's own hash, so its bytes must be
      # reproducible and must contain exactly the six release archives. Hence an explicit
      # list rather than `ls`: globbing would order by the runner's locale collation, would
      # absorb any stray file that lands in release/, and on a re-run would try to hash
      # SHA256SUMS itself. The order matches kEnvyReleaseTargets in src/envy_release.h.
      # Names are bare, not release/-prefixed: a bootstrap script looks up its own archive
      # by basename. A missing archive fails the step instead of yielding a short manifest.
      - name: Emit SHA256SUMS
        working-directory: release
        run: |
          sha256sum \
            envy-darwin-arm64.tar.gz \
            envy-darwin-x86_64.tar.gz \
            envy-linux-arm64.tar.gz \
            envy-linux-x86_64.tar.gz \
            envy-windows-arm64.zip \
            envy-windows-x86_64.zip \
            > SHA256SUMS

      - name: Create release with artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} \
            release/envy-linux-x86_64.tar.gz \
            release/envy-linux-arm64.tar.gz \
            release/envy-darwin-arm64.tar.gz \
            release/envy-darwin-x86_64.tar.gz \
            release/envy-windows-x86_64.zip \
            release/envy-windows-arm64.zip \
            release/SHA256SUMS \
            --repo ${{ github.repository }} \
            --generate-notes
