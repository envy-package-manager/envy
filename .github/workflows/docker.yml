name: docker

# Publishes the image every Linux CI job runs inside. Weekly rather than on every
# push so a green main is not hostage to an Ubuntu archive hiccup; the Dockerfile
# path filter still republishes immediately when the recipe itself changes.
on:
  schedule:
    - cron: '0 2 * * 0'  # Sunday 02:00 UTC
  push:
    branches: [main]
    paths:
      - .github/docker/Dockerfile
      - .github/workflows/docker.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/envy-ci

jobs:
  # Each arch builds on its own native runner -- qemu would work for a pure apt
  # image, but a native arm64 leg is faster and matches what CI actually runs on.
  # Pushed by digest with no tag, so nothing is publishable until both legs land.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux/amd64
            arch: amd64
          - os: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    runs-on: ${{ matrix.os }}
    # The implicit shell is `bash -e {0}`: no pipefail, so a failure anywhere but the
    # last stage of a pipeline is discarded, and no -u, so a typo'd name expands empty.
    defaults:
      run:
        shell: /usr/bin/env bash -Eeuo pipefail {0}
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .github/docker
          platforms: ${{ matrix.platform }}
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      # Filename is the bare hex digest; the manifest job reassembles the refs.
      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v6
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Both digests under one tag, so `docker pull ...:latest` resolves per-arch.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    # The implicit shell is `bash -e {0}`: no pipefail, so a failure anywhere but the
    # last stage of a pipeline is discarded, and no -u, so a typo'd name expands empty.
    defaults:
      run:
        shell: /usr/bin/env bash -Eeuo pipefail {0}
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create --tag "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
